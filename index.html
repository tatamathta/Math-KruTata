<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็คสถานะการส่งงานวิชาคณิตศาสตร์ - ครูตาท่า</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">📊 เช็คสถานะการส่งงาน</h1>
            <p class="text-sm text-slate-500 mt-1">วิชาคณิตศาสตร์ ชั้นประถมศึกษาปีที่ 6</p>
        </div>

        <!-- ฟอร์มเข้าสู่ระบบ -->
        <div id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">เลขประจำตัวนักเรียน</label>
                <input type="text" id="studentId" placeholder="เช่น 6552" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">รหัสผ่าน (วันเดือนปีเกิด เช่น 1234)</label>
                <input type="password" id="password" placeholder="ววปปปป" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <button onclick="checkStatus()" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md cursor-pointer">
                ตรวจสอบสถานะ
            </button>
            <p id="error-msg" class="text-red-500 text-sm text-center hidden mt-2"></p>
        </div>

        <!-- ส่วนแสดงผลสถานะ -->
        <div id="result-section" class="hidden space-y-4">
            <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 text-center">
                <h2 id="res-name" class="text-lg font-bold text-indigo-900"></h2>
                <p id="res-nickname" class="text-sm text-indigo-600 mt-0.5"></p>
            </div>
            
            <div>
                <h3 class="text-sm font-semibold text-slate-700 mb-2">สถานะการส่งงานทั้งหมด:</h3>
                <div id="homework-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <!-- รายการงานจะแสดงตรงนี้อัตโนมัติ -->
                </div>
            </div>

            <button onclick="logout()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 rounded-lg transition duration-200 cursor-pointer">
                🔍 ค้นหาใหม่อีกครั้ง
            </button>
        </div>
    </div>

    <script>
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxHOMgeBn38s4vjb_ox5b_H2UTl6KnOf-6DAkSs4jfW98UGe8xzyo-sy28uYjyjxZ_nYQ/exec"; 

        async function checkStatus() {
            const studentId = document.getElementById('studentId').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('submit-btn');

            if (!studentId || !password) {
                errorMsg.textContent = "กรุณากรอกข้อมูลให้ครบถ้วน";
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = "กำลังตรวจสอบ...";

            try {
                const url = `${scriptUrl}?studentId=${encodeURIComponent(studentId)}&password=${encodeURIComponent(password)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('res-name').textContent = data.fullName;
                    document.getElementById('res-nickname').textContent = "ชื่อเล่น: " + data.nickname;
                    
                    const listContainer = document.getElementById('homework-list');
                    listContainer.innerHTML = '';
                    
                    data.homeworks.forEach(hw => {
                        const div = document.createElement('div');
                        div.className = "flex justify-between items-center bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-lg text-sm";
                        div.innerHTML = `<span class="text-slate-700 font-medium">${hw.title}</span><span class="text-lg">${hw.status}</span>`;
                        listContainer.appendChild(div);
                    });

                    document.getElementById('login-form').classList.add('hidden');
                    document.getElementById('result-section').classList.remove('hidden');
                } else {
                    errorMsg.textContent = data.message || "เลขประจำตัวหรือรหัสผ่านไม่ถูกต้อง";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง";
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = "ตรวจสอบสถานะ";
            }
        }

        function logout() {
            document.getElementById('studentId').value = '';
            document.getElementById('password').value = '';
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        }
    </script>
</body>
</html>
