<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็คสถานะการส่งงานวิชาคณิตศาสตร์ - ครูตาท่า</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white/90 backdrop-blur-md rounded-3xl shadow-xl p-8 border border-indigo-100 relative overflow-hidden">
        <!-- ตกแต่งสัญลักษณ์คณิตศาสตร์น่ารักๆ -->
        <div class="absolute -top-6 -right-6 text-indigo-100 text-7xl select-none pointer-events-none font-bold">∑</div>
        <div class="absolute -bottom-6 -left-6 text-pink-100 text-7xl select-none pointer-events-none font-bold">π</div>

        <div class="text-center mb-6 relative z-10">
            <div class="inline-block bg-indigo-100 text-indigo-600 p-3 rounded-2xl mb-3 shadow-sm">
                <span class="text-2xl">🧮</span>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">❤️เช็คสถานะการส่งงาน❤️</h1>
            <p class="text-sm font-semibold text-indigo-600 mt-1">วิชาคณิตศาสตร์ ชั้นป.6 - ม.3 (By ครูตาต้า🫶)</p>
        </div>

        <!-- ฟอร์มเข้าสู่ระบบ -->
        <div id="login-form" class="space-y-4 relative z-10">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">เลขประจำตัวนักเรียน</label>
                <input type="text" id="studentId" placeholder="เช่น 6543" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:outline-none bg-slate-50/50">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">รหัสผ่าน (วันเดือนปีเกิด เช่น 16012567)</label>
                <input type="password" id="password" placeholder="ววดดปป" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:outline-none bg-slate-50/50">
            </div>
            <button onclick="checkStatus()" id="submit-btn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-md shadow-indigo-200 cursor-pointer">
                🔍 ตรวจสอบสถานะ 🔎
            </button>
            <p id="error-msg" class="text-red-500 text-sm text-center hidden mt-2"></p>
        </div>

        <!-- ส่วนแสดงผลสถานะ -->
        <div id="result-section" class="hidden space-y-4 relative z-10">
            <div class="bg-gradient-to-r from-indigo-50 to-purple-50 p-4 rounded-2xl border border-indigo-100 text-center shadow-sm">
                <h2 id="res-name" class="text-lg font-bold text-indigo-900"></h2>
                <p id="res-nickname" class="text-sm text-indigo-600 mt-0.5 font-medium"></p>
            </div>
            
            <!-- กล่องสรุปผลประเมินตามเงื่อนไข -->
            <div id="summary-box" class="p-3 rounded-xl text-center font-semibold text-sm shadow-xs"></div>

            <div>
                <h3 class="text-sm font-semibold text-slate-700 mb-2">📋 สถานะการส่งงานทั้งหมด (W):</h3>
                <div id="homework-list" class="space-y-2 max-h-50 overflow-y-auto pr-1">
                    <!-- รายการงานจะแสดงตรงนี้อัตโนมัติ -->
                </div>
            </div>

            <button onclick="logout()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl transition duration-200 cursor-pointer shadow-sm">
                🔄 ค้นหาใหม่อีกครั้ง
            </button>
        </div>
    </div>

    <script>
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxHOMgeBn38s4vjb_ox5b_H2UTl6KnOf-6DAkSs4jfW98UGe8xzyo-sy28uYjyjxZ_nYQ/exec"; 

        async function checkStatus() {
            const studentId = document.getElementById('studentId').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('submit-btn');

            if (!studentId || !password) {
                errorMsg.textContent = "กรุณากรอกข้อมูลให้ครบถ้วน";
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = "กำลังตรวจสอบ...";

            try {
                const url = `${scriptUrl}?studentId=${encodeURIComponent(studentId)}&password=${encodeURIComponent(password)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('res-name').textContent = data.fullName;
                    document.getElementById('res-nickname').textContent = "ชื่อเล่น: " + data.nickname;
                    
                    const listContainer = document.getElementById('homework-list');
                    listContainer.innerHTML = '';
                    
                    let greenCount = 0;
                    let yellowCount = 0;
                    let redCount = 0;
                    let total = data.homeworks.length;

                    data.homeworks.forEach(hw => {
                        if (hw.status === '🟢') greenCount++;
                        else if (hw.status === '🟡') yellowCount++;
                        else if (hw.status === '🔴') redCount++;

                        const div = document.createElement('div');
                        div.className = "flex justify-between items-center bg-slate-50 border border-slate-100 px-4 py-2.5 rounded-xl text-sm shadow-xs";
                        div.innerHTML = `<span class="text-slate-700 font-medium">${hw.title}</span><span class="text-lg">${hw.status}</span>`;
                        listContainer.appendChild(div);
                    });

                    // คำนวณและแสดงผลสรุปตามเงื่อนไข
                    const summaryBox = document.getElementById('summary-box');
                    let summaryText = "";
                    let summaryClass = "";

                    if (total === 0) {
                        summaryText = "ยังไม่มีรายการงาน W";
                        summaryClass = "bg-slate-100 text-slate-600 border border-slate-200";
                    } else {
                        let greenPercent = (greenCount / total) * 100;
                        let yellowPercent = (yellowCount / total) * 100;

                        if (greenCount === total) {
                            summaryText = "ส่งงานครบ ดีมาก 😃";
                            summaryClass = "bg-emerald-100 text-emerald-800 border border-emerald-200";
                        } else if (greenPercent >= 80 && yellowPercent <= 20 && redCount === 0) {
                            summaryText = "ส่งงานได้ดี แต่ยังขาดบางงานนะ 🙂";
                            summaryClass = "bg-blue-100 text-blue-800 border border-blue-200";
                        } else if (greenPercent >= 50 && greenPercent < 80) {
                            summaryText = "ส่งงานพอใช้ ติดตามส่งด้วยนะ 😐";
                            summaryClass = "bg-amber-100 text-amber-800 border border-amber-200";
                        } else if (greenPercent < 50 && greenPercent > 0) {
                            summaryText = "ส่งงานยังไม่เรียบร้อย ติดตามส่งด้วยนะ 😕";
                            summaryClass = "bg-orange-100 text-orange-800 border border-orange-200";
                        } else {
                            summaryText = "ติดตามส่งงานด่วน ☹️";
                            summaryClass = "bg-rose-100 text-rose-800 border border-rose-200";
                        }
                    }

                    summaryBox.className = `p-3 rounded-xl text-center font-semibold text-sm shadow-xs ${summaryClass}`;
                    summaryBox.textContent = summaryText;

                    document.getElementById('login-form').classList.add('hidden');
                    document.getElementById('result-section').classList.remove('hidden');
                } else {
                    errorMsg.textContent = data.message || "เลขประจำตัวหรือรหัสผ่านไม่ถูกต้อง";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง";
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = "🔍 ตรวจสอบสถานะ";
            }
        }

        function logout() {
            document.getElementById('studentId').value = '';
            document.getElementById('password').value = '';
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        }
    </script>
</body>
</html>
